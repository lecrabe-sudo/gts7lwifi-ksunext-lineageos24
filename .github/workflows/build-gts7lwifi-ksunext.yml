name: Build LineageOS 24 KernelSU-Next (SM-T870 / gts7lwifi)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gts7lwifi-ksunext.yml"
      - "ksunext-gts7lwifi/**"
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "LineageOS/android_kernel_samsung_sm8250 branch or commit"
        required: true
        default: "lineage-24.0"
        type: string
      ksu_ref:
        # Pinned to a reviewed commit of the `legacy` branch (4.19 non-GKI) so a
        # compromised or broken upstream push cannot silently land in the kernel.
        # Bump deliberately: git ls-remote https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/legacy
        description: "KernelSU-Next commit SHA (or branch/tag) - default is a pinned legacy commit"
        required: true
        default: "e5f5ec998de88b9fc43c62cff8f7ae12d3f4800a"
        type: string
      repack_boot_img:
        description: "Also repack latest official LineageOS 24.0 boot.img with the compiled kernel"
        required: true
        default: true
        type: boolean
      create_release:
        description: "Publish artifacts as a GitHub Release on completion"
        required: true
        default: false
        type: boolean

# Least privilege: the build only reads the repo. Only the optional `release`
# job below gets write access.
permissions:
  contents: read

env:
  # Third-party pins (bump deliberately, after review).
  KSU_DEFAULT_REF: "e5f5ec998de88b9fc43c62cff8f7ae12d3f4800a"   # KernelSU-Next legacy
  AK3_COMMIT: "41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1"        # osm0sis/AnyKernel3 master
  KSU_MANAGER_TAG: "v3.4.2"
  KSU_MANAGER_APK: "KernelSU_Next_v3.4.2_33355-release.apk"
  KSU_MANAGER_SHA256: "774a5511f7034a4930e881114e202319cbdc34c5aaaa5c7c6b6d2902364e4c58"

jobs:
  build:
    name: Build gts7lwifi LineageOS 24.0 + KernelSU-Next
    runs-on: ubuntu-24.04
    outputs:
      build_tag: ${{ steps.package.outputs.build_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            jq \
            kmod \
            libelf-dev \
            libssl-dev \
            libxml2 \
            lz4 \
            python3 \
            rsync \
            tar \
            xz-utils \
            zip

      - name: Download AOSP Clang r596125 (Clang 22.0.2)
        run: |
          WORK="${RUNNER_TEMP}/build"
          mkdir -p "${WORK}/clang"
          curl -fsSL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-17.0.0_r1/clang-r596125.tar.gz" \
            | tar -xz -C "${WORK}/clang"
          test -x "${WORK}/clang/bin/clang"
          "${WORK}/clang/bin/clang" --version
          echo "WORK=${WORK}" >> "$GITHUB_ENV"

      - name: Clone kernel, KernelSU-Next, AnyKernel3, and mkbootimg
        run: |
          clone_ref() {
            local url="$1" ref="$2" dest="$3" shallow="${4:-true}"
            local depth_args=()
            if [ "${shallow}" = "true" ]; then
              depth_args=(--depth=1)
            fi
            if ! git clone "${depth_args[@]}" --branch "${ref}" "${url}" "${dest}" 2>/dev/null; then
              rm -rf "${dest}"
              git init "${dest}"
              git -C "${dest}" remote add origin "${url}"
              git -C "${dest}" fetch "${depth_args[@]}" --tags origin "${ref}"
              git -C "${dest}" checkout FETCH_HEAD
            fi
          }

          clone_ref https://github.com/LineageOS/android_kernel_samsung_sm8250.git \
            "${{ inputs.kernel_branch || 'lineage-24.0' }}" "${WORK}/kernel" true
          # Keep full history and tags for KernelSU-Next so Kbuild computes KSU_VERSION cleanly.
          KSU_REF="${{ inputs.ksu_ref || env.KSU_DEFAULT_REF }}"
          clone_ref https://github.com/KernelSU-Next/KernelSU-Next.git \
            "${KSU_REF}" "${WORK}/KernelSU-Next" false
          KSU_HEAD="$(git -C "${WORK}/KernelSU-Next" rev-parse HEAD)"
          echo "KernelSU-Next HEAD: ${KSU_HEAD} (commits=$(git -C "${WORK}/KernelSU-Next" rev-list --count HEAD))"
          if [[ "${KSU_REF}" =~ ^[0-9a-f]{40}$ ]] && [ "${KSU_HEAD}" != "${KSU_REF}" ]; then
            echo "::error::KernelSU-Next HEAD ${KSU_HEAD} != pinned ${KSU_REF}"; exit 1
          fi

          clone_ref https://github.com/osm0sis/AnyKernel3.git \
            "${AK3_COMMIT}" "${WORK}/AnyKernel3" true
          test "$(git -C "${WORK}/AnyKernel3" rev-parse HEAD)" = "${AK3_COMMIT}"

          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.repack_boot_img == true }}" = "true" ]; then
            git clone --depth=1 --branch lineage-23.0 \
              https://github.com/LineageOS/android_system_tools_mkbootimg.git \
              "${WORK}/mkbootimg"
          fi

      - name: Integrate KernelSU-Next and manual hooks
        run: |
          python3 "${GITHUB_WORKSPACE}/ksunext-gts7lwifi/apply_ksu_hooks.py" \
            --kernel-dir "${WORK}/kernel" \
            --ksu-dir "${WORK}/KernelSU-Next"
          cp "${GITHUB_WORKSPACE}/ksunext-gts7lwifi/ksu.config" \
            "${WORK}/kernel/arch/arm64/configs/vendor/ksu.config"

      - name: Configure and compile kernel (gts7lwifi)
        run: |
          export PATH="${WORK}/clang/bin:${PATH}"
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            # A 4.19 tree compiled with modern Clang (r596125/clang-22) emits new
            # warnings; CONFIG_CC_WERROR=y would fail on unrelated legacy code.
            KCFLAGS=-Wno-error
          )

          make -C "${WORK}/kernel" "${MAKE_ARGS[@]}" \
            vendor/kona-perf_defconfig \
            vendor/samsung/kona-sec-common.config \
            vendor/samsung/gts7lwifi.config \
            vendor/ksu.config

          # Fail fast before compiling if key config flags did not stick
          grep -qx "CONFIG_KSU=y" "${WORK}/kernel/out/.config"
          grep -qx "CONFIG_KSU_MANUAL_HOOK=y" "${WORK}/kernel/out/.config"
          grep -qx "CONFIG_CFI_CLANG=y" "${WORK}/kernel/out/.config"
          grep -qx "CONFIG_OVERLAY_FS=y" "${WORK}/kernel/out/.config"
          ! grep -q "^CONFIG_KSU_KPROBES_HOOK=" "${WORK}/kernel/out/.config"
          ! grep -q "^CONFIG_KSU_SYSCALL_TABLE_HOOK=" "${WORK}/kernel/out/.config"

          make -C "${WORK}/kernel" -j"$(nproc)" "${MAKE_ARGS[@]}" Image
          test -s "${WORK}/kernel/out/arch/arm64/boot/Image"
          strings "${WORK}/kernel/out/arch/arm64/boot/Image" | grep -m1 "Linux version"

      - name: Package AnyKernel3 flashable zip
        id: package
        run: |
          DIST="${WORK}/dist"
          mkdir -p "${DIST}"
          KVER="$(git -C "${WORK}/kernel" rev-parse --short=8 HEAD)"
          KSU_VER="$(git -C "${WORK}/KernelSU-Next" rev-parse --short=8 HEAD)"
          BUILD_DATE="$(date -u +%Y%m%d)"
          TAG="lineage24-${BUILD_DATE}-k${KVER}-ksu${KSU_VER}"
          echo "BUILD_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "build_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "DIST=${DIST}" >> "$GITHUB_ENV"

          AK3="${WORK}/ak3-stage"
          mkdir -p "${AK3}"
          cp -r "${WORK}/AnyKernel3/META-INF" "${WORK}/AnyKernel3/tools" "${WORK}/AnyKernel3/LICENSE" "${AK3}/"
          cp "${GITHUB_WORKSPACE}/ksunext-gts7lwifi/anykernel.sh" "${AK3}/anykernel.sh"
          chmod +x "${AK3}/anykernel.sh"
          cp "${WORK}/kernel/out/arch/arm64/boot/Image" "${AK3}/Image"

          (cd "${AK3}" && zip -r9 "${DIST}/KernelSU-Next-gts7lwifi-${TAG}-ak3.zip" .)
          cp "${WORK}/kernel/out/arch/arm64/boot/Image" "${DIST}/Image-gts7lwifi-${TAG}"

      - name: Repack latest official LineageOS 24.0 boot.img (optional)
        if: github.event_name != 'workflow_dispatch' || inputs.repack_boot_img == true
        run: |
          API_JSON="${WORK}/los_builds.json"
          curl -fsSL "https://download.lineageos.org/api/v2/devices/gts7lwifi/builds" -o "${API_JSON}"

          BOOT_URL="$(jq -r '[.[] | select(.version=="24.0")][0].files[] | select(.filename=="boot.img") | .url' "${API_JSON}")"
          BOOT_SHA="$(jq -r '[.[] | select(.version=="24.0")][0].files[] | select(.filename=="boot.img") | .sha256' "${API_JSON}")"
          LOS_DATE="$(jq -r '[.[] | select(.version=="24.0")][0].date' "${API_JSON}")"

          if [ -z "${BOOT_URL}" ] || [ "${BOOT_URL}" = "null" ]; then
            echo "No LineageOS 24.0 boot.img found via API; skipping repack."
            exit 0
          fi

          curl -fsSL "${BOOT_URL}" -o "${WORK}/official-boot.img"
          echo "${BOOT_SHA}  ${WORK}/official-boot.img" | sha256sum -c -

          mkdir -p "${WORK}/unpacked_boot"
          declare -a MKBOOTIMG_ARGS=()
          while IFS= read -r -d '' ARG; do
            MKBOOTIMG_ARGS+=("${ARG}")
          done < <(python3 "${WORK}/mkbootimg/unpack_bootimg.py" \
            --boot_img "${WORK}/official-boot.img" \
            --out "${WORK}/unpacked_boot" \
            --format=mkbootimg -0)

          cp "${WORK}/kernel/out/arch/arm64/boot/Image" "${WORK}/unpacked_boot/kernel"
          OUT_BOOT="${DIST}/boot-lineage24-${LOS_DATE}-gts7lwifi-ksunext.img"
          python3 "${WORK}/mkbootimg/mkbootimg.py" "${MKBOOTIMG_ARGS[@]}" --output "${OUT_BOOT}"

          BOOT_SIZE="$(stat -c%s "${OUT_BOOT}")"
          echo "Repacked boot image size: ${BOOT_SIZE} bytes (partition max: 71303168)"
          test "${BOOT_SIZE}" -le 71303168

      - name: Fetch pinned KernelSU-Next manager APK (SHA-256 verified)
        run: |
          # Pinned release + checksum taken from the GitHub release asset digest.
          # A mismatching download fails the build instead of shipping an unknown APK.
          curl -fsSL \
            "https://github.com/KernelSU-Next/KernelSU-Next/releases/download/${KSU_MANAGER_TAG}/${KSU_MANAGER_APK}" \
            -o "${DIST}/${KSU_MANAGER_APK}"
          echo "${KSU_MANAGER_SHA256}  ${DIST}/${KSU_MANAGER_APK}" | sha256sum -c -

      - name: Generate SHA-256 checksums
        run: |
          (cd "${DIST}" && sha256sum * > SHA256SUMS.txt)
          cat "${DIST}/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gts7lwifi-ksunext-${{ env.BUILD_TAG }}
          path: ${{ env.DIST }}/*

  release:
    name: Publish GitHub Release (optional)
    needs: build
    if: inputs.create_release == true
    runs-on: ubuntu-24.04
    # Only this job may write to the repository (tags/releases).
    permissions:
      contents: write
    env:
      BUILD_TAG: ${{ needs.build.outputs.build_tag }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gts7lwifi-ksunext-${{ needs.build.outputs.build_tag }}
          path: dist

      - name: Verify checksums before publishing
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v-${{ env.BUILD_TAG }}
          name: "gts7lwifi LineageOS 24.0 + KernelSU-Next (${{ env.BUILD_TAG }})"
          body: |
            Compiled on Ubuntu 24.04 using AOSP Clang r596125 (`clang-22`),
            `LineageOS/android_kernel_samsung_sm8250` (`${{ inputs.kernel_branch || 'lineage-24.0' }}`),
            and `KernelSU-Next` (`${{ inputs.ksu_ref || env.KSU_DEFAULT_REF }}`, `CONFIG_KSU_MANUAL_HOOK=y`).
          files: dist/*
